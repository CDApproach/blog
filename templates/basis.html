<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}{{ site.titel }}{% endblock %}</title>
<meta name="description" content="{% block beschreibung %}{{ site.untertitel }}{% endblock %}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23f5c46b'/><circle cx='16' cy='16' r='15' fill='none' stroke='%23f5c46b' stroke-opacity='.35' stroke-width='2'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}static/style.css?v={{ version }}">
{% block kopf %}{% endblock %}
</head>
<body class="{% block body_klasse %}{% endblock %}" {% block body_attr %}{% endblock %}>
<div class="raum" aria-hidden="true"></div>
<header class="kopf">
  <a class="marke" href="{{ root }}index.html">{{ site.titel }}</a>
  <nav class="kategorien" aria-label="Kategorien">
    <a href="{{ root }}index.html"{% if aktiv is defined and aktiv is none %} aria-current="page"{% endif %}>Alle</a>
    {% for slug, k in kategorien.items() %}
    <a href="{{ root }}{{ slug }}/index.html"{% if aktiv is defined and aktiv == slug %} aria-current="page"{% endif %}>{{ k[0] }}</a>
    {% endfor %}
  </nav>
</header>
<main>
{% block inhalt %}{% endblock %}
</main>
<footer class="fuss">{{ site.titel }} · {{ site.autor }}</footer>
{% block skripte %}{% endblock %}
</body>
</html>
